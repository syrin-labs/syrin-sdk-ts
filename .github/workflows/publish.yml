name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to publish to"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - Production

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract and validate version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            PKG_VERSION=$(node -p "require('./package.json').version")
            if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
              echo "Version mismatch: package.json=${PKG_VERSION}, tag=${TAG_VERSION}"
              exit 1
            fi
            echo "Version OK: ${PKG_VERSION}"
            echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "version=manual" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-workspaces

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  publish:
    name: Publish to ${{ github.event.inputs.environment || 'npm' }}
    runs-on: ubuntu-latest
    needs: [validate, test]
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-workspaces

      - name: Build
        run: npm run build

      - name: Publish to npm
        if: github.event.inputs.environment == 'Production' || github.event_name == 'push'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry-run (test environment)
        if: github.event.inputs.environment == 'test'
        run: npm publish --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
